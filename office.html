<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HARU CAPITAL</title>
<meta name="description" content="AIの社員12人が運営するヘッジファンド。毎朝5:30に朝会、会議もチャットも全部公開。">
<meta property="og:type" content="website"><meta property="og:url" content="https://haru-capital.com/office.html">
<meta property="og:title" content="HARU CAPITAL ｜ AIの社員12人が運営するヘッジファンドのオフィス">
<meta property="og:description" content="毎朝5:30に朝会。AIの社員が議論し、本物の株価で売買を記録するシミュレーション。会議もチャットも全部公開。">
<meta property="og:image" content="https://haru-capital.com/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://haru-capital.com/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=BIZ+UDGothic:wght@400;700&family=Inter:wght@500;600;700;800&family=Montserrat:wght@600;800&display=swap">
<style>
:root{
  --bg:#070b18; --panel:#0e1530; --panel2:#131c40; --line:#26326a; --ink:#eef2ff; --dim:#aab3da; --mute:#7480b0;
  --gold:#ffb547; --up:#3ddc97; --down:#ff6b6b; --warn:#ffcc4d; --tm:#8b8cf5;
  --chat:#11162e; --chat2:#171d3b; --rail:#0b1026;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --num:"Inter","Noto Sans JP",system-ui,sans-serif;  /* 数字は欧文のInter（桁がそろう等幅数字）、円・万などは日本語のフォントで */
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:16px 60px}
section{margin-top:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{margin:0;font-size:17px;font-weight:900}
.sec-h small{color:var(--mute);font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700}
.chip.pri{background:var(--gold);border-color:var(--gold);color:#0a0f24}

/* ヘッダー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,11,24,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@media (max-width:640px){.top{position:static}}  /* スマホでは画面が狭いので、ヘッダーをついてこさせない */
.top .in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
.logo svg{width:36px;height:36px;flex:0 0 36px}
.logo .wm{font:800 22px/1 Montserrat,var(--sans);letter-spacing:.06em;display:flex;flex-direction:column}
.logo .wm i{font-style:normal;color:var(--gold)}
.logo .wm small{font:600 9.5px/1 Montserrat,var(--sans);letter-spacing:.5em;color:var(--dim);margin-top:4px}
.phase{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.phase i{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 2s infinite}
.phase.off i{background:var(--mute);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.tk{display:flex;flex-direction:column;line-height:1.25}
.tk small{font-size:11.5px;color:var(--mute)}
.tk b{font:700 16px var(--num)}
/* 数字の符号（▲・+）と単位（万円・%など）は小さく添える（レポートと同じ見せ方。JavaScript の decoNum が組み直す） */
.sg{font-size:.7em;margin-right:.04em;vertical-align:.08em}.u{font-family:var(--sans);font-size:.6em;font-weight:700;margin-left:.1em;letter-spacing:0}

/* 成績サマリー */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;text-align:left;min-width:0;transition:border-color .2s,transform .2s;position:relative}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card small{display:block;font-size:12.5px;color:var(--dim);font-weight:700}
.card b{display:block;font:700 22px/1.35 var(--num);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card em{display:block;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card svg{display:block;width:100%;height:26px;margin-top:4px}
.card::after{content:"›";position:absolute;right:12px;top:8px;color:var(--mute);font-size:18px}

/* フロアとチャット */
.duo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
.floorbox{--sky1:#141640;--sky2:#4a3062;--sky3:#e0784a;--glow:rgba(255,150,80,.55);--city:#0a0f26;--lit:.5;position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 80px,var(--sky3) 146px,#151d43 154px,#0b1230 100%);transition:background 1s}
.floorbox::before{content:"";position:absolute;inset:0 0 auto;height:154px;z-index:1;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 3px),rgba(5,8,22,.85) calc(20% - 3px) 20%),radial-gradient(420px 120px at 78% 100%,var(--glow),transparent 70%);pointer-events:none}
.skyline{position:absolute;left:0;right:0;top:0;width:100%;height:154px;z-index:0;pointer-events:none}
.skyline .b{fill:var(--city)}
.skyline .w{fill:#ffd27a;opacity:var(--lit)}
.skyline .st{fill:#fff;opacity:calc(var(--lit) - .3)}
.floorhead,.floor,.nowlist{z-index:2}
.floorhead{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px 0;min-height:104px}
.floorhead h2{text-shadow:0 1px 6px rgba(0,0,0,.7)}
.floorhead h2{margin:0;font-size:15px;font-weight:900}
.floor{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px 12px 14px}
.tile[data-id=pm]{grid-row:span 2;order:-1;aspect-ratio:auto}  /* ファンドマネージャーは左に縦長の大きな席 */
.tile[data-id=pm] img,.tile[data-id=pm] video{object-position:42% 35%}  /* 人物が写真の左寄りなので、そちらに合わせて切り取る */
.tile{--c:var(--gold);position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#000;border:2px solid rgba(255,255,255,.08);padding:0;text-align:left;transition:transform .4s,border-color .3s,box-shadow .3s}
.tile video,.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 7px 6px;background:linear-gradient(transparent,rgba(4,6,16,.94));line-height:1.3}
.tile .cap b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:900;line-height:1.3}
.tile .cap small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile img.empty{opacity:0;transition:opacity .8s}
.tile[data-p=away] img.empty,.tile[data-p=off] img.empty{opacity:1}
.tile.talk img.empty{opacity:0}  /* 今日の流れを再生して話している人は、席に戻す */
.tile .pres{position:absolute;right:6px;top:6px;display:none;padding:1px 7px;border-radius:999px;background:rgba(4,6,16,.78);color:var(--dim);font-size:10.5px;font-weight:700}
.tile[data-p=away] .pres,.tile[data-p=off] .pres{display:block}.tile.talk .pres{display:none}
.tile[data-p=away] .st,.tile[data-p=off] .st{background:#5b6386}
.tile .st{position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.tile.talk{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 12px 30px -10px var(--c);transform:translateY(-3px)}
.tile.hear{border-color:var(--c)}
.tile .typing{position:absolute;left:6px;right:6px;top:22px;display:none;background:#fbfcff;color:#12172e;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700}
.tile.talk .typing{display:block}
.nowlist{position:relative;padding:0 12px 12px;display:grid;gap:4px}
.nowlist h3{margin:2px 0 4px;font-size:13px;color:var(--dim);font-weight:700}
.nl{display:grid;grid-template-columns:26px max-content 38px minmax(0,1fr);gap:8px;align-items:center;border:0;background:rgba(7,11,24,.55);border-radius:8px;padding:5px 8px;text-align:left;font-size:13px}
.nl:hover{background:rgba(31,39,84,.9)}
.nl img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nl b{font-size:12.5px;white-space:nowrap}
.nl small{color:var(--mute);font:500 11.5px var(--num)}
.nl span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dim)}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.toast{position:absolute;right:10px;bottom:10px;z-index:6;width:min(340px,calc(100% - 20px));display:grid;gap:6px}
.note{display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:center;background:#fbfcff;color:#12172e;border-radius:12px;padding:8px 10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.7);border-left:4px solid var(--c,#ffb547);animation:slide .4s ease-out}
.note img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.note b{font-size:12px;color:#4b5375;display:block;line-height:1.3}
.note p{margin:0;font-size:13px;font-weight:700;line-height:1.45}
@keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 社内チャット（Teams風） */
.chatbox{display:grid;grid-template-columns:168px minmax(0,1fr);height:640px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--chat)}
.rail,.pane{min-width:0}
.att{overflow-x:auto}
.rail{background:var(--rail);border-right:1px solid #1d2448;display:flex;flex-direction:column;min-height:0}
.team{display:flex;align-items:center;gap:8px;padding:12px 10px 10px;font-weight:900;font-size:13px;white-space:nowrap;border-bottom:1px solid #1d2448}
.team svg{width:26px;height:26px}
.chs{overflow:auto;padding:6px}
.ch{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--dim);text-align:left}
.ch:hover{background:#151c3d}
.ch.on{background:#1f2754;color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--tm)}
.ch .n{font:700 11px var(--num);background:var(--tm);color:#fff;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.newpill{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:3;border:0;border-radius:999px;background:var(--tm);color:#fff;font-weight:700;font-size:13px;padding:6px 16px;box-shadow:0 10px 24px -8px rgba(0,0,0,.7)}
.pane header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid #1d2448;background:var(--chat2)}
.pane header b{font-size:15px}
.pane header .mem{display:flex}
.pane header .mem img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--chat2);margin-left:-6px}
.msgs{flex:1;overflow:auto;padding:8px 6px 14px;scroll-behavior:smooth}
.dsep{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:12px 10px 6px}
.dsep::before,.dsep::after{content:"";flex:1;height:1px;background:#1d2448}
.post{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 10px;border-radius:8px}
.post:hover{background:#151c3d}
.post.cont{padding-top:0}
.post.cont .av{visibility:hidden;height:0}
.post .av{width:36px;height:36px;border-radius:50%;object-fit:cover}
.post .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.4}
.post .hd b{font-size:14px}
.post .hd small{font-size:11.5px;color:var(--mute)}
.post .tx{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.post.new{animation:pop .35s ease-out}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rx{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;border:1px solid #2a3170;background:#141a3a;color:var(--mute);font:inherit;font-size:12px;cursor:pointer}
.rx:hover{border-color:#4a56b0}.rx.mine{border-color:var(--tm);background:rgba(139,140,245,.18);color:#e8ecff}
.rx .e{font-size:14px;line-height:1}
.pvid{position:relative}.pvid .awaytag{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(4,6,16,.8);color:#e8ecff;font-size:12.5px;font-weight:700}
.rx.add{opacity:0;transition:opacity .15s}.post:hover .rx.add,.rx.add:focus-visible{opacity:1}
@media (hover:none){.rx.add{opacity:.55}}
.post.new .rxs{animation:rxin .3s ease-out 1.1s both}
@keyframes rxin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mention{color:var(--tm);font-weight:700}
.post.to-me{box-shadow:inset 3px 0 0 var(--tm);background:rgba(139,140,245,.07)}
.mtg{display:flex;align-items:center;gap:10px;margin:8px 10px;padding:8px 12px;border:1px solid #2a3170;border-radius:10px;background:#141a3a;font-size:13px}
.mtg svg{width:22px;height:22px;flex:0 0 22px}
.mtg b{font-size:13.5px}
.att{margin-top:6px;border:1px solid #2a3170;border-radius:10px;overflow:hidden;background:#0d1229;max-width:620px}
.att .ah{font-size:12px;font-weight:700;color:var(--dim);padding:6px 10px;background:#141a3a;border-bottom:1px solid #2a3170;display:flex;justify-content:space-between;gap:8px}
.att table{width:100%;border-collapse:collapse;font-size:12.5px}
.att td,.att th{padding:4px 10px;border-top:1px solid #1a2048;text-align:left;vertical-align:top;white-space:nowrap}
.att td:last-child{white-space:normal}
.att th{color:var(--mute);font-weight:500;border-top:0}
.att td.r,.att th.r{text-align:right;white-space:nowrap;font-family:var(--num)}
.att .mn{padding:8px 12px;font-size:13px}
.att .mn h5{margin:8px 0 2px;font-size:12px;color:var(--gold)}
.att .mn ul{margin:0;padding-left:18px}
.att details summary{cursor:pointer;padding:6px 10px;font-size:12.5px;color:var(--tm);font-weight:700}
.typingrow{padding:2px 56px 6px;font-size:12px;color:var(--mute);min-height:22px}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mute);margin-left:3px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.2}}

/* ポジション */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--mute);font-weight:500;font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid #161f45;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#121a3c}
.tbl td.nm b{font-weight:700}
.tbl td.nm small{color:var(--mute);margin-left:6px}
.side{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.side.b{background:rgba(61,220,151,.15);color:var(--up)}.side.s{background:rgba(255,107,107,.15);color:var(--down)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 10px 10px;overflow-x:auto}
.empty{color:var(--mute);font-size:13.5px;padding:14px 6px}
.ribbon{font-size:13px;color:#ffd99a;background:rgba(255,181,71,.12);border-radius:8px;padding:6px 10px;margin:6px 0}

/* 予定 */
.day{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.45;position:relative;min-width:0}
.slot .tm{font:700 15px var(--num)}
.slot h4{margin:0;font-size:13.5px;font-weight:900}
.slot .s{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;background:var(--line);color:var(--dim)}
.slot.done .s{background:rgba(61,220,151,.15);color:var(--up)}
.slot.now{border-color:var(--gold)}
.slot.now .s{background:var(--gold);color:#0a0f24}
.slot .who{display:flex;margin-top:4px}
.slot .who img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:2px solid var(--panel);margin-right:-5px}

/* 議事録 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--gold);color:#0a0f24;border-color:var(--gold)}
.paper{background:#f7f5ef;color:#1b1f2e;border-radius:16px;padding:18px 22px}
.paper h3{margin:0 0 4px;font-size:18px}
.paper h4{margin:12px 0 2px;font-size:14px}
.paper p,.paper li{font-size:14px}
.paper ul{margin:2px 0;padding-left:20px}
.paper .muted{color:#6b6f80;font-size:12.5px}
.paper .line{display:grid;grid-template-columns:28px 1fr;gap:8px;margin:4px 0;font-size:13.5px}
.paper .line img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.paper .line b{font-size:12.5px;color:#4b5375}
.paper details summary{cursor:pointer;font-weight:700;font-size:13.5px;margin-top:10px}
.paper table td,.paper table th{color:#1b1f2e}  /* 議事録の表は紙の色に合わせて濃い文字に（暗い画面用の白文字を受け継がない） */

/* 検証 */
.rs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rs div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.rs small{color:var(--dim);font-size:12.5px}
.rs b{display:block;font:700 22px var(--num)}
footer{margin-top:30px;font-size:12px;color:var(--mute);line-height:1.7}
footer p{margin:10px 0 0}

/* 入力欄・資金の試算 */
.composer{display:flex;gap:8px;padding:8px 10px;border-top:1px solid #1d2448;background:var(--chat2)}
.composer input{flex:1;min-width:0;background:#0d1229;border:1px solid #2a3170;border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--tm)}
.composer button{border:0;border-radius:8px;background:var(--tm);color:#fff;font-weight:700;padding:0 16px}
.composer button:disabled{opacity:.5}
.capbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:12px;font-size:13px}
.capbar input{width:110px;background:#0d1229;border:1px solid #2a3170;border-radius:8px;padding:5px 8px;color:var(--ink);font:700 14px var(--num);text-align:right}
.capbar small{flex-basis:100%;color:var(--warn);font-size:12px}
/* 株価ボード */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.q{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 8px;text-align:left;min-width:0;line-height:1.35;position:relative}
.q:hover{border-color:var(--gold)}
.q b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q span{display:block;font:700 14px var(--num)}
.q em{font-style:normal;font:700 12px var(--num)}
.q i{position:absolute;right:6px;top:6px;font-style:normal;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px}
.q i.b{background:rgba(61,220,151,.18);color:var(--up)}.q i.s{background:rgba(255,107,107,.18);color:var(--down)}
.q.upc{background:linear-gradient(160deg,rgba(61,220,151,.10),var(--panel))}.q.dnc{background:linear-gradient(160deg,rgba(255,107,107,.10),var(--panel))}
/* 社員とコミュニケーション */
.picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pk{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:left}
.pk:hover{border-color:var(--c)}
.pk img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--c)}
.pk b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk small{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stf{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.stf .pvid{margin:0;max-height:none}
/* 詳細パネル */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(3,5,14,.6);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.dp{width:min(760px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:din .25s ease-out}
@keyframes din{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dp header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top,0px))}
.dp header h3{margin:0;font-size:18px;font-weight:900;flex:1;min-width:0}
.dp header button{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;font-size:18px}
.db{flex:1;overflow:auto;padding:14px 18px 40px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--mute);font-size:12px}
.kv b{font:700 17px var(--num)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;position:relative}
.chart h5{margin:0 0 4px;font-size:13px;color:var(--dim)}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:#fbfcff;color:#12172e;border-radius:8px;padding:4px 8px;font:700 12px var(--num);white-space:nowrap;display:none}
.leg{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:4px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.box h5{margin:0 0 6px;font-size:13px;color:var(--gold)}
.pvid{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:#000;max-height:420px;margin-bottom:12px}
.pvid video,.pvid img{width:100%;height:100%;object-fit:cover;display:block}
.ask{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ask button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.ans{display:grid;grid-template-columns:34px 1fr;gap:8px}
.ans img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ans div{background:#fbfcff;color:#12172e;border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:14px;line-height:1.65;min-height:40px;white-space:pre-wrap}
.free{display:flex;gap:6px;margin-top:8px}
.free input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);font:inherit;font-size:14px}
.term{background:#000;border:2px solid #1d2448;border-radius:10px;padding:5px;margin-bottom:12px}
.term svg{display:block;width:100%;height:auto}
.pstep{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px solid #161f45;padding:6px 0;font-size:13.5px}
.pstep .n{font:700 12px var(--num);color:#0a0f24;background:var(--gold);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.pstep small{display:block;color:var(--mute);font-size:12px}
.pstep .x{font:700 14px var(--num)}

"], ["損した：関西電力", "−89万円"]]}, "kind": "close_report"}, {"ts": "2026-11-09T20:36:27+09:00", "date": "2026-11-09", "channel": "朝会", "from": "llm_strategist", "to": null, "text": "9日は前週の半導体急落からの自律反発（日経+3.5%超）。ただし10日はNvidiaのCEO・Jensen Huang氏が中国スパイ疑惑で社内調査を受け、NVDA株が前日比−4〜5%安と再び売られており半導体セクターへの逆風が復活。9日の米国株はS&P500+0.36%・ナスダック微高と勢いは限定的。ドル円158円台が輸出株を下支えするが、VIX23.65と不安定な地合いは続く。ソフトバンクGが大引け後に2Q決算を控えポジション調整売りも出やすい。全体は利食い先行・上値の重い軟調展開と見る。過熱した内需・娯楽株はリターンリバーサルに注意。\n傾ける銘柄：OLC -0.12、ソフトバンクG +0.10、ハピネット -0.15、東エレク -0.08", "card": {"type": "table", "cols": ["確認したニュース"], "rows": [["NvidiaのCEO Jensen Huang氏、中国スパイ疑惑で社内独立調査を発表、NVDA前日比−4〜5%（CNBC、2026-11-09）"], ["9日米国株：S&P500 +0.36%、ナスダック微高と勢いは限定的（Yahoo Finance、2026-11-09）"], ["ドル円：米10月雇用統計大幅上振れでFRBの12月利上げ確率約80%、158円台で膠着（外為どっとコム、2026-11-09）"], ["ソフトバンクG（9984.T）、11月10日大引け後に2Q（4〜9月期）連結決算を発表予定（Bloomberg、2026-11-09）"], ["任天堂（7974.T）2Q決算：売上高9,660億円（−12.1%）・営業利益2,165億円（+49.1%）、Switch2が収益性を改善（任天堂IR、2026-11-05）"], ["東京市場11月10日見通し：ナスダック・SOX連動の売り先行で軟調な展開続く見込み（ウエルスアドバイザー via Yahoo!ファイナンス、2026-11-09）"]]}, "kind": "news"}, {"ts": "2026-11-09T20:39:01+09:00", "date": "2026-11-09", "channel": "朝会", "from": "llm_strategist", "to": null, "text": "今週話題になったテーマを調べました。生成AI・AIエージェント、サイバーセキュリティ、半導体製造装置・材料、防衛・装備インフラ、データセンター電力。", "card": {"type": "table", "cols": ["テーマ", "なぜ話題か"], "rows": [["生成AI・AIエージェント", "AnthropicがNASDAQへIPO（日本で最大5529億円募集、Bloomberg 11/2）。OpenAI・Googleも新モデル発表でAI基盤需要が一段と加速。"], ["サイバーセキュリティ", "損保ジャパン・SMBCコンシューマーFA・JNSAで不正アクセス3件連続（11/5〜6）。OpenAIがセキュリティ特化モデルGPT-6 Cyberを発表（11/5）し攻防需要が増大。"], ["半導体製造装置・材料", "7〜9月期決算でアドバンテスト2倍増益・ディスコ好調、一方レーザーテック44%減益と明暗。AI向け先端品需要の選別が進む局面で個別株物色が活発化。"], ["防衛・装備インフラ", "川崎重工が防衛売上高「2030年代に1兆円超」目標発表（10/6）。防衛費8.8兆円で過去最高、重工3社の受注残は前年比15%増の6兆円超（日経）。"], ["データセンター電力", "AI DC建設計画が全国20拠点以上に拡大（10月データ更新）。電力・建設・光ケーブルの3セクターに資金流入が継続。大手電力も供給契約を積み増し中。"]]}, "kind": "universe_themes"}, {"ts": "2026-11-09T20:39:01+09:00", "date": "2026-11-09", "channel": "朝会", "from": "pm", "to": null, "text": "今週は、いつもの銘柄に12銘柄を足して見立てを出します。新しく入れたのは11銘柄、外したのは5銘柄です。外し rom": "trend", "to": null, "text": "オラクル、東京応化のAIスコア+0.50は認めるけど、価格トレンドは-0.38で崩れてる。ニュースと価格は別で見てほしい。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "llm_strategist", "to": null, "text": "フジクラの急落はファンダから完全に乖離してる。売りより逆張り買いか、少なくとも見送りを推す。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "meanrev", "to": null, "text": "日立が逆張り的に過売れ域にある。でも売り候補にも出てて、ロング持ちながらどうする？ハル、判断を聞きたい。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "trend", "to": null, "text": "日立のトレンド-0.46、今日の反発はノイズだと思う。方向は下、ロングは整理すべきでは。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "pm", "to": null, "text": "東京応化・フジクラ・三菱重工はオラクルの指摘で今日は見送り。日立はサカキとハヤテで真逆だが今日は維持、来週火曜に再評価する。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "cro", "to": null, "text": "JR東と三井不動産でロス合計3,097万、ドローダウン6.42%は上限に近づいてる。三井不動産のショートを半分に縮小してリスクを落としたい。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "macro", "to": null, "text": "金利5.15%なら三井不動産のショート根拠は生きてる。縮小は理解するけど方向は正しいよ。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "pm", "to": null, "text": "イワオの指摘を受けて三井不動産は半分縮小。JR東は継続。ソラの言う通り方向性は変わらない。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "carry_value", "to": null, "text": "SUMCOはトレンド崩壊に割高感も重なってる。ルネサス・東エレクも半導体全面安で売りシグナルが一致。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "trader", "to": null, "text": "第一三共は2,852円台、100株28.5万で入りやすい。SUMCOは79%ボラで指値必須。東エレクは1単元94.6万で重いから分割執行にしたい。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "cro", "to": null, "text": "東エレク1単元94.6万はデカい。ボラ58%もある。単元数を絞って入るなら許容できる。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "pm", "to": null, "text": "今日の採用：買いは第一三共のみ。売りはSUMCO・東エレク・ルネサス・ソフトバンクGを採用。日立ロングは来週再評価、三井不動産は縮小執行で頼む、キリ。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "scribe", "to": null, "text": "承りました。第一三共ロング・SUMCO/東エレク/ルネサス/SBGショート採用・三井不動産縮小・日立ロング来週再評価を記録します。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "scribe", "to": null, "text": "朝会の議事録です。", "card": {"type": "minutes", "title": "朝会", "summary": "第一三共をロング追加、半導体3銘柄＋SBGをショート採用。東京応化・フジクラは業績乖離リスクで見送り。三井不動産は金利逆風も累損を考慮し半分縮小、日立ロングは来週再評価。", "points": ["東京応化：上方修正ニュース（AI+0.50）vs価格トレンド崩壊（-0.38）の相克", "フジクラ：業績超好調と-36%急落の大きな乖離、ショートは踏み上げリスク", "日立：ロング保有中（-1,068万）に売り候補スコア-0.35が出た矛盾をどう扱うか", "三井不動産：金利逆風でショート根拠は生きるが累損1,245万＋全体ドローダウン6.42%のリスク管理"], "decisions": ["第一三共（4568.T）ロング新規採用", "SUMCO（3436.T）・東エレク（8035.T）・ルネサス（6723.T）・SBG（9984.T）ショート採用", "三井不動産ショートポジションを半分に縮小", "JR東ショート継続（金利逆風でショート根拠維持）", "日立ロング維持、来週火曜に再評価", "東京応化・フジクラ・三菱重工は本日見送り"], "dissent": ["オラクル：東京応化のショートに反対（上方修正確認で安定しやすいため）", "オラクル：フジクラのショートに反対（業績超好調との乖離が大きく踏み上げリスク）", "ソラ：三井不動産縮小に消極的（金利5.15%でショート根拠は継続中と主張）"], "todo": ["イワオ：来週火曜に日立ロングのリスク精査と継続・撤退の方針案を提出", "ハヤテ：三菱重工・防衛株動向を継続モニタリングし次回朝会に報告", "オラクル：フジクラの業績乖離が解消するか週次でフォローアップ"]}, "kind": "minutes"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "pm", "to": null, "text": "朝会の結論です。第一三共をロング追加、半導体3銘柄＋SBGをショート採用。東京応化・フジクラは業績乖離リスクで見送り。三井不動産は金利逆風も累損を考慮し半分縮小、日立ロングは来週再評価。\n買い：第一三共／売り：ＳＵＭＣＯ、東エレク、ルネサス、ソフトバンクG", "card": {"type": "table", "cols": ["銘柄", "向き", "理由"], "rows": [["第一三共", "買い", "割安+0.29で買い候補最高値、マクロ中立で金利影響小さい"], ["ＳＵＭＣＯ", "売り", "トレンド-0.62・1か月-20%、全スコアがマイナスで最強シグナル"], ["東エレク", "売り", "半導体全面安の主要銘柄、4指標全マイナスで方向一致"], ["ルネサス", "売り", "半導体セクター同調安、逆張り・マクロ・トレンド揃う"], ["ソフトバンクG", "売り", "トレンド-0.75・1か月-26.9%、AIスコアも-0.50で総崩れ"]]}, "kind": "decision"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "朝会", "from": "pm", "to": "cro", "text": "採用した銘柄で配分を組みました。買い1・売り4銘柄、想定の値動きは年率10.0%。イワオさん、審査をお願いします。", "card": null, "kind": "proposal"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "発注・約定", "from": "cro", "to": "pm", "text": "審査しました。1項目中0項目は問題なし。ガバナンス：承認済みの設定でないため、売買しない。「停止（ガバナンス）」で通します。", "card": {"type": "table", "cols": ["項目", "結果", "内容"], "rows": [["ガバナンス", "停止", "承認済みの設定でないため、売買しない"]]}, "kind": "review"}, {"ts": "2026-11-16T05:37:48+09:00", "date": "2026-11-16", "channel": "発注・約定", "from": "trader", "to": null, "text": "今の保有との差が小さいので、今朝の注文はありません。", "card": null, "kind": "no_order"}, {"ts": "2026-11-16T06:06:00+09:00", "date": "2026-11-16", "channel": "朝会", "from": "pm", "to": "anchor", "text": "@ユキ 11月16日のマーケットデイリーレポートを公開しました。告知をお願いします。", "card": null, "kind": "report_request"}, {"ts": "2026-11-16T06:06:00+09:00", "date": "2026-11-16", "channel": "朝会", "from": "anchor", "to": "pm", "text": "@ハル 承知しました！Xとサイトでお知らせしますね📣\n本日は「防衛株急落の一服が焦点」。ハル・キャピタルは本日のマーケットを「慎重、循環物色」に見ています。\nhttps://haru-capital.com/report/2026-11-16.html", "card": null, "kind": "report_published"}, {"ts": "2026-11-16T11:40:16+09:00", "date": "2026-11-16", "channel": "報告", "from": "data", "to": null, "text": "前場（11:25時点、約20分遅れ）の値動きです。TOPIX -0.51%。\nソフトバンクG -3.5%（売り4,400.0株、54万円）\nKDDI +3.4%（売り15,700.0株、−151万円）\n富士通 +2.3%（買い9,200.0株、72万円）", "card": null, "kind": "midday_moves"}, {"ts": "2026-11-16T11:40:16+09:00", "date": "2026-11-16", "channel": "報告", "from": "cro", "to": null, "text": "前場の損益（概算）は−387万円（-0.41%）です。", "card": null, "kind": "midday_pnl"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "data", "to": null, "text": "前場はマイナス387万、-0.41%。TOPIXの-0.51%より小幅に抑えたが、KDDIショートが3.4%上がって-151万、三菱UFJが1.6%下落で-143万と、この2本が重かった。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "cro", "to": null, "text": "上位2本だけで294万円消えた。KDDIの逆行が特に痛い。今日の損失ペース次第では管理上の警戒水準に触れる。損切りラインを全員で確認しておきたい。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "macro", "to": null, "text": "銀行2本が揃って赤なのは気になる。朝からリスクオフぎみで、金利敏感株に売りが先行する地合いだったと見ている。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "trend", "to": null, "text": "KDDIはここ数日の上昇モメンタムが続いていた。ショートはトレンドへの逆張りになっている状態だ。サカキ、短期はどう見る？", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "meanrev", "to": null, "text": "KDDIは過熱圏に入りつつある。今日の+3.4%は想定外に早い動きだが、もう少し上を試した後で戻りが来ると思う。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "llm_strategist", "to": null, "text": "富士通の+2.3%はIT・DX関連への買いが一因とみられる。KDDIは通信セクター全体の動向を朝会までに整理する。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "pm", "to": null, "text": "場中は動かない方針は変えない。KDDIの逆行は痛いが、サカキの見立て通りなら焦らなくていい。後場はホールドで様子見。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "cro", "to": null, "text": "後場もKDDIが上値を伸ばせば損失がさらに膨らむ。損切り基準だけ明日の朝会で確認させてほしい。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "pm", "to": null, "text": "イワオ、了解。宿題は三点：KDDIの逆行要因はオラクル、銀行下落のマクロ背景はソラ、明日の執行準備はキリ。損切りラインは朝会で再確認する。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "trader", "to": null, "text": "三井不動産の半分縮小と第一三共ロング追加、明日の執行準備を整えます。流動性は問題ない水準です。", "card": null, "kind": "meeting"}, {"ts": "2026-11-16T11:42:09+09:00", "date": "2026-11-16", "channel": "昼会", "from": "scribe", "to": null, "text": "確認します。後場 , "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "macro", "to": null, "text": "米金利5.12%がグロースの重し。NVIDIA決算前は半導体に売りが先行、メガバンク上方修正が対抗材料です。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "meanrev", "to": null, "text": "東エレクは逆張りも-0.43で下落継続圧力です。JR東日本の累損1852万は大きく、縮小を提案します。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "carry_value", "to": null, "text": "第一三共は割安+0.29で最も支持できます。日立は全スコアマイナス転換、ロング継続の根拠がありません。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "llm_strategist", "to": null, "text": "メガバンク3行の上方修正が今日の対抗材料です。第一三共は昨日の宿題、寄りから優先執行してください。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "trend", "to": null, "text": "ハル、JR東日本のトレンドは+0.77でロング方向です。ショートの累損と方向が逆、サカキどう見ますか。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "meanrev", "to": null, "text": "サカキです。マクロ逆風・訪日自粛があっても累損1852万は重すぎます。半縮小で損失を圧縮すべきです。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "macro", "to": null, "text": "ソラです。三菱UFJは今日大幅安でしたが、上方修正・自社株買いの材料があります。ロング維持を支持します。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "carry_value", "to": null, "text": "シズクです。日立は売り候補-0.36入りです。ロングのままショートを追加するのは数字と矛盾します。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "cro", "to": null, "text": "イワオです。半導体ショートを複数積むのは業種集中リスク。日立のロング解消が条件、追加は1本限りにします。", "card": null, "kind": "meeting"}, {"ts": "2026-11-17T05:37:59+09:00", "date": "2026-11-17", "channel": "朝会", "from": "llm_strategist", "to": null, "text": "三井不動産の半縮小も昨日からの未執行宿題です。ハ let LIVE=null;
const LIVE_ON=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
const basePx=a=>LIVE?.prev?.[a]??D.screens.last[a];
function liveDay(){const pnl=P.rows.reduce((s,r)=>s+(r.today||0),0),tp=LIVE.prices["1306.T"],tb=basePx("1306.T");
  return{pnl,ret:pnl/Math.max(P.nav-pnl,1),bench_ret:tp!=null&&tb?tp/tb-1:0}}
function applyLive(L){LIVE=L;const px=L.prices,op=L.open||{};
  // 寄付き成行の注文は、今日の寄付き値で約定したものとして仮に並べる（正式な約定は夕会で記録される）
  P.pending.filter(o=>o.created_asof<L.date&&op[o.asset]!=null&&!P.rows.some(r=>r.asset===o.asset)).forEach(o=>
    P.rows.push({asset:o.asset,units:o.units,avg_cost:op[o.asset],price:op[o.asset],chg:0,value:0,weight:0,unreal:0,today:0,since:L.date,realized:0,prov:true}));
  P.rows.forEach(r=>{const p=px[r.asset];if(p==null)return;const base=basePx(r.asset);
    r.price=p;r.chg=base?p/base-1:r.chg;r.value=Math.round(r.units*p);r.unreal=Math.round(r.units*(p-r.avg_cost));
    r.today=Math.round(r.units*(p-(r.since===L.date?r.avg_cost:base)))});  // 今日建てた分は取得単価から
  // 仮の約定はまだ現金に反映していないので、損益の分だけ足す
  P.nav=Math.round(P.cash+P.rows.reduce((s,r)=>s+(r.prov?r.units*(r.price-r.avg_cost):r.units*r.price),0));
  P.unreal_total=P.rows.reduce((s,r)=>s+r.unreal,0);P.rows.forEach(r=>r.weight=r.value/P.nav);P.rows.sort((a,b)=>Math.abs(b.value)-Math.abs(a.value));
  renderTop();renderBoard();renderPos();
  const t=`${L.asof||""}時点の値段で評価（約20分遅れ・1分ごとに更新）`+(P.rows.some(r=>r.prov)?"。今朝の注文は寄付き値で約定したものとして仮に計算（夕会で確定）":"");
  document.getElementById("pos-sub").textContent=t;document.getElementById("px-sub").textContent=t}

/* スタンプ（Teamsのリアクション）。社員のぶんは投稿の中身から決める（同じ投稿にはいつも同じスタンプ）。あなたのぶんはこのブラウザに残す */
function hsh(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.codePointAt(0),16777619);return h>>>0}
const rxKey=m=>`${m.ts}|${m.from}|${(m.text||"").slice(0,24)}`;
function staffRx(m){const h=hsh(rxKey(m)),t=m.text||"",out={};

    map.next="寄付きの約定を確かめ、インターン研修の指導に戻ります。"}

function openStaff(id){const s=BY[id],{map,mine}=info(id),aw=awayText(id),pr=presence(id);

const nowTs=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,19)+"+09:00";

const today=()=>jst().date;
function ownerDefault(ch){return ch==="発注・約定"?"trader":ch==="データ"?"data":"pm"}
function mergeOwner(list){const fresh=list.filter(m=>!ownerSeen.has(m.id)).sort((a,b)=>a.ts.localeCompare(b.ts));
  fresh.forEach(m=>{ownerSeen.add(m.id);D.chat.push(m);const i=D.chat.length-1;
    if(delivered!==null){delivered.add(i)}

      box.insertAdjacentHTML("beforeend",postHTML(m,prev,true));const el=box.lastElementChild;
      if(m.from==="owner"){box.scrollTop=box.scrollHeight}else{el.dataset.unread="1";pillN++;updPill();watchRead(el)}}
    else{unread[m.channel]++;renderChannels()}});
  if(fresh.length)renderNow()}
async function saveOwnerMsg(m){const ref=db.doc("ownerchat/"+m.date);const snap=await ref.get();const msgs=(snap.exists?snap.data().msgs:[])||[];

async function initOwnerChat(){if(!(window.claude&&typeof window.claude.use==="function"))return;
  let usr=null;try{usr=await window.claude.use("user")}catch(e){}
  const own=usr?await usr.isOwner().catch(()=>false):false;if(!own)return;
  try{db=await window.claude.use("db")}catch(e){db=null}if(!db)return;
  const f=document.getElementById("composer"),inp=document.getElementById("cmsg");f.hidden=false;
  const ph=()=>inp.placeholder=`# ${cur} にメッセージ（@ハル などで宛先。指定がなければ${BY[ownerDefault(cur)].role}が答えます）`;ph();
  document.getElementById("chs").addEventListener("click",ph);
  IS_OWNER=true;
  db.doc("ownersettings/capital").onSnapshot(sn=>{capReqs=(sn.exists&&sn.data().requests)||[];if(!dr.hidden&&document.getElementById("capbox")&&window.__redrawPerf)window.__redrawPerf()},()=>{});
  mergeOwner(OWNER_POSTS);
  db.collection("ownerchat").onSnapshot(snap=>mergeOwner(snap.docs.flatMap(d=>(d.data()?.msgs)||[])),()=>{});
  f.onsubmit=async e=>{e.preventDefault();const text=inp.value.trim();if(!text)return;inp.value="";const btn=document.getElementById("csend");btn.disabled=true;
    const mm=text.match(/@(ハル|キリ|イワオ|ミナト|フデ|オラクル|ハヤテ|サカキ|ソラ|シズク)/),to=mm?MENTION[mm[1]]:ownerDefault(cur);
    const m={id:"o"+Date.now(),ts:new Date(Date.now()+9*36e5).toISOString().slice(0,19)+"+09:00",date:today(),channel:cur,from:"owner",to,text,kind:"owner"};
    try{await saveOwnerMsg(m)}catch(err){alertBar(err?.code==="quota_exceeded"?"保存できる量の上限に達しました":"送れませんでした。もう一度お試しください");btn.disabled=false;return}
    mergeOwner([m]);btn.disabled=false;
    const aw=awayText(to);
    if(aw){const rep={id:"r"+Date.now(),ts:nowTs(),date:today(),channel:m.channel,from:to,to:"owner",text:aw,kind:"auto_reply"};
      await saveOwnerMsg(rep).catch(()=>{});mergeOwner([rep]);return}
    if(!sampleFn)return;const s=BY[to],ty=document.getElementById("typing");ty.innerHTML=`${esc(s.role)}（${esc(s.name)}）が入力中<span class="dots"><i></i><i></i><i></i></span>`;
    const recent=D.chat.filter(x=>x.date===latestDate||x.date===today()).slice(-40).map(x=>`${BY[x.from]?.role||x.from}（${BY[x.from]?.name||""}）#${x.channel}: ${x.text}`);
    const ctx={会社:D.fund,基準日:D.asof,純資産:P.nav,保有:P.rows.map(r=>({銘柄:SN(r.asset),株数:r.units,評価損益:r.unreal})),注文:D.orders.map(o=>({銘柄:SN(o.asset),区分:o.label,株数:o.units})),
      朝会の結論:T?.meeting?.summary,審査:T?.checks?.map(c=>c.check+":"+c.detail),最近のやりとり:recent};
    const prompt=`あなたは日本株ロング・ショートのヘッジファンド「${D.fund}」の${s.role}「${s.name}」です。会社の持ち主（オーナー）から社内チャットの #${m.channel} で話しかけられました。社員として、話し言葉で、200字以内で返事をしてください。\n・下の社内データにあることだけを根拠にする。ないことは「手元のデータにはありません」と言う。数字を作らない\n・売買の指示を受けたら、その場では発注しない。「次の会議で検討し、ハルの承認と審査を通してから」と伝える\n・特定の銘柄の売買を、オーナー以外の人にすすめる言い方をしない\n社内データ:${JSON.stringify(ctx)}\nオーナーのメッセージ:${text}`;
    try{const r=await sampleFn(prompt,{modelTier:"quick",cache:false});ty.innerHTML="";
      const rep={id:"r"+Date.now(),ts:new Date(Date.now()+9*36e5).toISOString().slice(0,19)+"+09:00",date:today(),channel:m.channel,from:to,to:"owner",text:r.text.trim(),kind:"reply"};
      await saveOwnerMsg(rep).catch(()=>{});mergeOwner([rep])}
    catch(err){ty.innerHTML="";alertBar(err?.code==="rate_limited"?"少し待ってからもう一度送ってください":"返事を作れませんでした（メッセージは保存済みで、次の会議で取り上げます）")}}}

    catch(err){a.textContent=err?.code==="rate_limited"?"少し待ってから聞いてください。":"うまく答えられませんでした。";if(err?.code==="not_granted")f.hidden=true}}}
