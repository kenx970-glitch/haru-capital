<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HARU CAPITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=BIZ+UDGothic:wght@400;700&family=Montserrat:wght@600;800&display=swap">
<style>
:root{
  --bg:#070b18; --panel:#0e1530; --panel2:#131c40; --line:#26326a; --ink:#eef2ff; --dim:#aab3da; --mute:#7480b0;
  --gold:#ffb547; --up:#3ddc97; --down:#ff6b6b; --warn:#ffcc4d; --tm:#8b8cf5;
  --chat:#11162e; --chat2:#171d3b; --rail:#0b1026;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --num:"BIZ UDGothic","Noto Sans JP",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:16px 60px}
section{margin-top:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{margin:0;font-size:17px;font-weight:900}
.sec-h small{color:var(--mute);font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700}
.chip.pri{background:var(--gold);border-color:var(--gold);color:#0a0f24}

/* ヘッダー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,11,24,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
.logo svg{width:36px;height:36px;flex:0 0 36px}
.logo .wm{font:800 22px/1 Montserrat,var(--sans);letter-spacing:.06em;display:flex;flex-direction:column}
.logo .wm i{font-style:normal;color:var(--gold)}
.logo .wm small{font:600 9.5px/1 Montserrat,var(--sans);letter-spacing:.5em;color:var(--dim);margin-top:4px}
.phase{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.phase i{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 2s infinite}
.phase.off i{background:var(--mute);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.tk{display:flex;flex-direction:column;line-height:1.25}
.tk small{font-size:11.5px;color:var(--mute)}
.tk b{font:700 16px var(--num)}

/* 成績サマリー */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;text-align:left;min-width:0;transition:border-color .2s,transform .2s;position:relative}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card small{display:block;font-size:12.5px;color:var(--dim);font-weight:700}
.card b{display:block;font:700 22px/1.35 var(--num);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card em{display:block;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card svg{display:block;width:100%;height:26px;margin-top:4px}
.card::after{content:"›";position:absolute;right:12px;top:8px;color:var(--mute);font-size:18px}

/* フロアとチャット */
.duo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
.floorbox{--sky1:#141640;--sky2:#4a3062;--sky3:#e0784a;--glow:rgba(255,150,80,.55);--city:#0a0f26;--lit:.5;position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 80px,var(--sky3) 146px,#151d43 154px,#0b1230 100%);transition:background 1s}
.floorbox::before{content:"";position:absolute;inset:0 0 auto;height:154px;z-index:1;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 3px),rgba(5,8,22,.85) calc(20% - 3px) 20%),radial-gradient(420px 120px at 78% 100%,var(--glow),transparent 70%);pointer-events:none}
.skyline{position:absolute;left:0;right:0;top:0;width:100%;height:154px;z-index:0;pointer-events:none}
.skyline .b{fill:var(--city)}
.skyline .w{fill:#ffd27a;opacity:var(--lit)}
.skyline .st{fill:#fff;opacity:calc(var(--lit) - .3)}
.floorhead,.floor,.nowlist{z-index:2}
.floorhead{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px 0;min-height:104px}
.floorhead h2{text-shadow:0 1px 6px rgba(0,0,0,.7)}
.floorhead h2{margin:0;font-size:15px;font-weight:900}
.floor{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 12px 14px}
.tile{--c:var(--gold);position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#000;border:2px solid rgba(255,255,255,.08);padding:0;text-align:left;transition:transform .4s,border-color .3s,box-shadow .3s}
.tile video,.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 7px 6px;background:linear-gradient(transparent,rgba(4,6,16,.94));line-height:1.3}
.tile .cap b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:900;line-height:1.3}
.tile .cap small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .st{position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.tile.talk{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 12px 30px -10px var(--c);transform:translateY(-3px)}
.tile.hear{border-color:var(--c)}
.tile .typing{position:absolute;left:6px;right:6px;top:22px;display:none;background:#fbfcff;color:#12172e;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700}
.tile.talk .typing{display:block}
.nowlist{position:relative;padding:0 12px 12px;display:grid;gap:4px}
.nowlist h3{margin:2px 0 4px;font-size:13px;color:var(--dim);font-weight:700}
.nl{display:grid;grid-template-columns:26px max-content 38px minmax(0,1fr);gap:8px;align-items:center;border:0;background:rgba(7,11,24,.55);border-radius:8px;padding:5px 8px;text-align:left;font-size:13px}
.nl:hover{background:rgba(31,39,84,.9)}
.nl img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nl b{font-size:12.5px;white-space:nowrap}
.nl small{color:var(--mute);font:500 11.5px var(--num)}
.nl span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dim)}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.toast{position:absolute;right:10px;bottom:10px;z-index:6;width:min(340px,calc(100% - 20px));display:grid;gap:6px}
.note{display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:center;background:#fbfcff;color:#12172e;border-radius:12px;padding:8px 10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.7);border-left:4px solid var(--c,#ffb547);animation:slide .4s ease-out}
.note img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.note b{font-size:12px;color:#4b5375;display:block;line-height:1.3}
.note p{margin:0;font-size:13px;font-weight:700;line-height:1.45}
@keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 社内チャット（Teams風） */
.chatbox{display:grid;grid-template-columns:168px minmax(0,1fr);height:640px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--chat)}
.rail,.pane{min-width:0}
.att{overflow-x:auto}
.rail{background:var(--rail);border-right:1px solid #1d2448;display:flex;flex-direction:column;min-height:0}
.team{display:flex;align-items:center;gap:8px;padding:12px 10px 10px;font-weight:900;font-size:13px;white-space:nowrap;border-bottom:1px solid #1d2448}
.team svg{width:26px;height:26px}
.chs{overflow:auto;padding:6px}
.ch{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--dim);text-align:left}
.ch:hover{background:#151c3d}
.ch.on{background:#1f2754;color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--tm)}
.ch .n{font:700 11px var(--num);background:var(--tm);color:#fff;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.newpill{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:3;border:0;border-radius:999px;background:var(--tm);color:#fff;font-weight:700;font-size:13px;padding:6px 16px;box-shadow:0 10px 24px -8px rgba(0,0,0,.7)}
.pane header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid #1d2448;background:var(--chat2)}
.pane header b{font-size:15px}
.pane header .mem{display:flex}
.pane header .mem img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--chat2);margin-left:-6px}
.msgs{flex:1;overflow:auto;padding:8px 6px 14px;scroll-behavior:smooth}
.dsep{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:12px 10px 6px}
.dsep::before,.dsep::after{content:"";flex:1;height:1px;background:#1d2448}
.post{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:6px 10px;border-radius:8px}
.post:hover{background:#151c3d}
.post.cont{padding-top:0}
.post.cont .av{visibility:hidden;height:0}
.post .av{width:36px;height:36px;border-radius:50%;object-fit:cover}
.post .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.4}
.post .hd b{font-size:14px}
.post .hd small{font-size:11.5px;color:var(--mute)}
.post .tx{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.post.new{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mention{color:var(--tm);font-weight:700}
.post.to-me{box-shadow:inset 3px 0 0 var(--tm);background:rgba(139,140,245,.07)}
.mtg{display:flex;align-items:center;gap:10px;margin:8px 10px;padding:8px 12px;border:1px solid #2a3170;border-radius:10px;background:#141a3a;font-size:13px}
.mtg svg{width:22px;height:22px;flex:0 0 22px}
.mtg b{font-size:13.5px}
.att{margin-top:6px;border:1px solid #2a3170;border-radius:10px;overflow:hidden;background:#0d1229;max-width:620px}
.att .ah{font-size:12px;font-weight:700;color:var(--dim);padding:6px 10px;background:#141a3a;border-bottom:1px solid #2a3170;display:flex;justify-content:space-between;gap:8px}
.att table{width:100%;border-collapse:collapse;font-size:12.5px}
.att td,.att th{padding:4px 10px;border-top:1px solid #1a2048;text-align:left;vertical-align:top;white-space:nowrap}
.att td:last-child{white-space:normal}
.att th{color:var(--mute);font-weight:500;border-top:0}
.att td.r,.att th.r{text-align:right;white-space:nowrap;font-family:var(--num)}
.att .mn{padding:8px 12px;font-size:13px}
.att .mn h5{margin:8px 0 2px;font-size:12px;color:var(--gold)}
.att .mn ul{margin:0;padding-left:18px}
.att details summary{cursor:pointer;padding:6px 10px;font-size:12.5px;color:var(--tm);font-weight:700}
.typingrow{padding:2px 56px 6px;font-size:12px;color:var(--mute);min-height:22px}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mute);margin-left:3px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.2}}

/* ポジション */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--mute);font-weight:500;font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid #161f45;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#121a3c}
.tbl td.nm b{font-weight:700}
.tbl td.nm small{color:var(--mute);margin-left:6px}
.side{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.side.b{background:rgba(61,220,151,.15);color:var(--up)}.side.s{background:rgba(255,107,107,.15);color:var(--down)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 10px 10px;overflow-x:auto}
.empty{color:var(--mute);font-size:13.5px;padding:14px 6px}
.ribbon{font-size:13px;color:#ffd99a;background:rgba(255,181,71,.12);border-radius:8px;padding:6px 10px;margin:6px 0}

/* 予定 */
.day{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.45;position:relative;min-width:0}
.slot .tm{font:700 15px var(--num)}
.slot h4{margin:0;font-size:13.5px;font-weight:900}
.slot .s{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;background:var(--line);color:var(--dim)}
.slot.done .s{background:rgba(61,220,151,.15);color:var(--up)}
.slot.now{border-color:var(--gold)}
.slot.now .s{background:var(--gold);color:#0a0f24}
.slot .who{display:flex;margin-top:4px}
.slot .who img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:2px solid var(--panel);margin-right:-5px}

/* 議事録 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--gold);color:#0a0f24;border-color:var(--gold)}
.paper{background:#f7f5ef;color:#1b1f2e;border-radius:16px;padding:18px 22px}
.paper h3{margin:0 0 4px;font-size:18px}
.paper h4{margin:12px 0 2px;font-size:14px}
.paper p,.paper li{font-size:14px}
.paper ul{margin:2px 0;padding-left:20px}
.paper .muted{color:#6b6f80;font-size:12.5px}
.paper .line{display:grid;grid-template-columns:28px 1fr;gap:8px;margin:4px 0;font-size:13.5px}
.paper .line img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.paper .line b{font-size:12.5px;color:#4b5375}
.paper details summary{cursor:pointer;font-weight:700;font-size:13.5px;margin-top:10px}

/* 検証 */
.rs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rs div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.rs small{color:var(--dim);font-size:12.5px}
.rs b{display:block;font:700 22px var(--num)}
footer{margin-top:30px;font-size:12px;color:var(--mute);line-height:1.7}
footer p{margin:10px 0 0}

/* 入力欄・資金の試算 */
.composer{display:flex;gap:8px;padding:8px 10px;border-top:1px solid #1d2448;background:var(--chat2)}
.composer input{flex:1;min-width:0;background:#0d1229;border:1px solid #2a3170;border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--tm)}
.composer button{border:0;border-radius:8px;background:var(--tm);color:#fff;font-weight:700;padding:0 16px}
.composer button:disabled{opacity:.5}
.capbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:12px;font-size:13px}
.capbar input{width:110px;background:#0d1229;border:1px solid #2a3170;border-radius:8px;padding:5px 8px;color:var(--ink);font:700 14px var(--num);text-align:right}
.capbar small{flex-basis:100%;color:var(--warn);font-size:12px}
/* 株価ボード */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.q{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 8px;text-align:left;min-width:0;line-height:1.35;position:relative}
.q:hover{border-color:var(--gold)}
.q b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q span{display:block;font:700 14px var(--num)}
.q em{font-style:normal;font:700 12px var(--num)}
.q i{position:absolute;right:6px;top:6px;font-style:normal;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px}
.q i.b{background:rgba(61,220,151,.18);color:var(--up)}.q i.s{background:rgba(255,107,107,.18);color:var(--down)}
.q.upc{background:linear-gradient(160deg,rgba(61,220,151,.10),var(--panel))}.q.dnc{background:linear-gradient(160deg,rgba(255,107,107,.10),var(--panel))}
/* 社員とコミュニケーション */
.picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pk{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:left}
.pk:hover{border-color:var(--c)}
.pk img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--c)}
.pk b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk small{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stf{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.stf .pvid{margin:0;max-height:none}
/* 詳細パネル */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(3,5,14,.6);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.dp{width:min(760px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:din .25s ease-out}
@keyframes din{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dp header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top,0px))}
.dp header h3{margin:0;font-size:18px;font-weight:900;flex:1;min-width:0}
.dp header button{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;font-size:18px}
.db{flex:1;overflow:auto;padding:14px 18px 40px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--mute);font-size:12px}
.kv b{font:700 17px var(--num)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;position:relative}
.chart h5{margin:0 0 4px;font-size:13px;color:var(--dim)}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:#fbfcff;color:#12172e;border-radius:8px;padding:4px 8px;font:700 12px var(--num);white-space:nowrap;display:none}
.leg{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:4px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}

function lineChart(series,{h=180,fmt=v=>v,id="c"}={}){const all=series.flatMap(s=>s.v),n=series[0].v.length;
  if(n<2)return `<div class="empty">グラフは、2営業日目の引け後から表示します。</div>`;
  const W=640,H=h,pl=56,pr=10,pt=10,pb=24,lo=Math.min(...all),hi=Math.max(...all),r=(hi-lo)||1;
  const X=i=>pl+i/(n-1)*(W-pl-pr),Y=v=>pt+(1-(v-lo)/r)*(H-pt-pb);
  const ticks=[lo,lo+r/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1d2448"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#7480b0" font-family="BIZ UDGothic">${fmt(v)}</text>`).join("");
  const lab=series[0].x;const xl=`<text x="${pl}" y="${H-6}" font-size="11" fill="#7480b0">${esc(lab[0])}</text><text x="${W-pr}" y="${H-6}" font-size="11" fill="#7480b0" text-anchor="end">${esc(lab.at(-1))}</text>`;
  const paths=series.map(s=>`<path d="${s.v.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ")}" stroke="${s.c}" stroke-width="${s.w||2}" fill="none" ${s.dash?'stroke-dasharray="5 4"':""}/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" data-chart="${id}">${ticks}${xl}${paths}<line class="cur" y1="${pt}" y2="${H-pb}" stroke="#aab3da" stroke-dasharray="2 3" opacity="0"/><rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent"/></svg><div class="tip"></div>`}
function wireTip(el,series,fmt){const svg=el.querySelector("svg"),tip=el.querySelector(".tip");if(!svg)return;const n=series[0].v.length;
  svg.addEventListener("mousemove",e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*640,i=Math.round((x-56)/(640-66)*(n-1));if(i<0||i>=n)return;
    const cx=56+i/(n-1)*(640-66);svg.querySelector(".cur").setAttribute("x1",cx);svg.querySelector(".cur").setAttribute("x2",cx);svg.querySelector(".cur").setAttribute("opacity",1);
    tip.style.display="block";tip.innerHTML=`${esc(series[0].x[i])}　`+series.map(s=>`<span style="color:${s.c==="#fbfcff"?"#12172e":s.c}">${esc(s.n)} ${fmt(s.v[i])}</span>`).join("　");
    tip.style.left=Math.min(e.clientX-el.getBoundingClientRect().left+10,el.clientWidth-tip.offsetWidth-6)+"px";tip.style.top="8px"});
  svg.addEventListener("mouseleave",()=>{tip.style.display="none";svg.querySelector(".cur").setAttribute("opacity",0)})}
function barChart(items){if(!items.length)return `<div class="empty">まだデータがありません。</div>`;const mx=Math.max(...items.map(x=>Math.abs(x.v)))||1;
  return items.map(x=>`<div style="display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:3px 0"><span>${esc(x.l)}</span><span style="position:relative;height:10px;background:#121933;border-radius:5px"><i style="position:absolute;top:0;height:10px;border-radius:5px;${x.v>=0?"left:50%":"right:50%"};width:${Math.abs(x.v)/mx*50}%;background:${x.v>=0?"var(--up)":"var(--down)"}"></i><i style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#3a4680"></i></span><span class="num ${cls(x.v)}" style="text-align:right">${yen(x.v,true)}</span></div>`).join("")}

const lotOf=a=>a==="1306.T"?10:100;

    ${F()!==1?`<small>${yen(simCap)}で運用した場合の試算です（実際の運用資金は${yen(D.initial_nav)}のまま）。各銘柄の割合は同じで、株数は100株単位に切り下げています。そのため少額では買えない銘柄が出ます。</small>`:""}</div>`}
function openPerf(tab="perf"){const tabs=[["perf","推移"],["pos","ポジション"],["names","銘柄別の損益"],["exp","ポジション総額"],["trades","約定履歴"]];

    if(k==="names"){const agg=(D.history.pnl||[]).reduce((m,v)=>(m[v.asset]=(m[v.asset]||0)+v.pnl,m),{});

const W=140,H=88;
function spath(arr,x,y,w,h,mn,mx){mn=mn??Math.min(...arr);mx=mx??Math.max(...arr);const r=(mx-mn)||1;return arr.map((v,i)=>`${i?"L":"M"}${(x+i/(arr.length-1)*w).toFixed(1)} ${(y+h-(v-mn)/r*h).toFixed(1)}`).join(" ")}
const tx=(x,y,t,c="#dfe4ff",s=6,a="start",w=400)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="BIZ UDGothic,Noto Sans JP,monospace" font-size="${s}" font-weight="${w}" fill="${c}">${esc(t)}</text>`;
function hd(t,r=""){return `<rect width="${W}" height="11" fill="#ffa028"/>`+tx(3,8.2,t,"#000",6.2,"start",700)+(r?tx(W-3,8.2,r,"#000",6.2,"end",700):"")}
function topOf(an){const s=T?.scores?.[an]||{};let b=null;for(const [a,v] of Object.entries(s))if(!b||Math.abs(v)>Math.abs(b[1]))b=[a,v];return b}
const SCREEN={
  data(){const A=Object.keys(D.universe),bad=T?.quality?.asset_issues||{};return hd("値段の点検",T?.quality?.last_bar||"")+A.map((a,i)=>{const x=3+Math.floor(i/11)*46,y=19+(i%11)*6.4;return tx(x,y,SN(a).slice(0,6),"#cfd6f5",4.6)+tx(x+43,y,bad[a]?"!":"✓",bad[a]?"#ff6b6b":"#3ddc97",4.6,"end",700)}).join("")},
  trend(){const t=topOf("trend");if(!t)return hd("勢い");const [a,v]=t,s=D.screens.short[a].slice(-120),ma=s.map((_,i)=>{const w=s.slice(Math.max(0,i-19),i+1);return w.reduce((x,y)=>x+y,0)/w.length}),mn=Math.min(...s),mx=Math.max(...s);
    return hd(SN(a)+"・120日",`見立て ${sgn(v)}`)+`<path d="${spath(s,4,16,132,60,mn,mx)}" stroke="#4d9dff" stroke-width="1.5" fill="none"/><path d="${spath(ma,4,16,132,60,mn,mx)}" stroke="#fff" stroke-width=".9" stroke-dasharray="3 2" fill="none" opacity=".6"/>`+tx(4,85,`点線＝20日平均`,"#aab3da",5.4)},
  meanrev(){const s=T?.scores?.meanrev||{},A=Object.keys(D.universe),t=topOf("meanrev");return hd("1週間の行き過ぎ",t?`${SN(t[0])} ${sgn(t[1])}`:"")+`<line x1="3" y1="48" x2="137" y2="48" stroke="#3a4680"/>`+A.map((a,i)=>{const v=s[a]||0,h=Math.min(Math.abs(v)*60,30);return `<rect x="${4+i*4.3}" y="${v>=0?48-h:48}" width="3.2" height="${Math.max(h,.5)}" fill="${v>=0?"#3ddc97":"#ff6b6b"}"/>`}).join("")},
  macro(){const m=D.screens.macro,nk=m["^N225"],fx=m["JPY=X"];return hd("相場全体","日経平均・ドル円")+tx(4,20,`日経平均 ${Math.round(nk.at(-1)).toLocaleString("ja-JP")}円`,"#ffb547",5.6)+`<path d="${spath(nk,4,22,132,22)}" stroke="#ffb547" stroke-width="1.3" fill="none"/>`+tx(4,54,`ドル円 ${fx.at(-1).toFixed(1)}円`,"#7ee0a8",5.6)+`<path d="${spath(fx,4,56,132,22)}" stroke="#7ee0a8" stroke-width="1.3" fill="none"/>`},
  carry_value(){const t=topOf("carry_value");if(!t)return hd("割高・割安");const [a,v]=t,s=D.screens.long[a],m=s.reduce((x,y)=>x+y,0)/s.length,sd=Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/s.length),mn=Math.min(...s,m-sd),mx=Math.max(...s,m+sd),Y=x=>16+60-(x-mn)/(mx-mn)*60;
    return hd(SN(a)+"・3年",`見立て ${sgn(v)}`)+`<rect x="4" y="${Y(m+sd)}" width="132" height="${Y(m-sd)-Y(m+sd)}" fill="#ff7ea8" opacity=".15"/><line x1="4" x2="136" y1="${Y(m)}" y2="${Y(m)}" stroke="#ff7ea8" stroke-dasharray="3 2"/><path d="${spath(s,4,16,132,60,mn,mx)}" stroke="#fff" stroke-width="1.2" fill="none"/>`},
};
function info(id){const R=D.reports,mine=D.chat.filter(m=>m.from===id&&m.date===latestDate);
  const last=mine.at(-1);
  const map={now:last?`${hm(last.ts)}に「${last.text.split("\n")[0]}」と報告しました。`:"今日はまだ投稿していません。",
    why:"",num:"",next:""};
  if(["trend","meanrev","macro","carry_value"].includes(id)&&T){const t=topOf(id);if(t){const [a,v]=t,vw=T.views.find(x=>x.analyst===id&&x.asset===a);
    map.why=`一番強く見ているのは${NM(a)}で${sgn(v)}です。根拠は「${vw?.rationale||""}」。外れるのは「${vw?.invalidated_if||""}」のときです。`;
    map.num=`今の重みは${(T.analyst_weights[id]||0).toFixed(2)}。期限が来た見立てから自動で採点されます。`;map.next="明朝7:35に次の見立てを出し、朝会で議論します。"}}
  if(id==="data"&&T){map.why="値段が1つでも壊れていると、全員の判断が壊れるからです。";map.num=`${T.quality.last_bar}の終値で点検、異常${Object.keys(T.quality.asset_issues).length}件。`;map.next="11:40に前場の値動き、16:30に終値を確定させます。"}
  if(id==="llm_strategist"&&T?.strategist){map.why=T.strategist.narrative;map.num=`傾けた銘柄：${(T.strategist.tilts||[]).map(x=>`${SN(x.asset)} ${sgn(x.tilt)}`).join("、")||"なし"}`;map.next="明朝7:40にニュースを読み直します。"}
  if(id==="pm"&&T){const mt=T.meeting||{};map.why=mt.summary||"";map.num=`買い${(mt.longs||[]).length}・売り${(mt.shorts||[]).length}銘柄を採用。想定の値動きは年率${(T.ex_ante_vol*100).toFixed(1)}%。`+(T.approval?`発注は${T.approval.approve?"承認":"見送り"}${T.approval.rejected?.length?`（却下${T.approval.rejected.length}件）`:""}。`:"");map.next="昼会で前場を確認し、夕会で明日の注目銘柄を決めます。"}
  if(id==="cro"&&T){map.why="運用から独立して、損失の段階・値動き・業種の偏りの限度を守らせるためです。減らすことしかできません。";map.num=`${T.checks.length}項目中${T.checks.filter(c=>c.status==="PASS").length}項目が問題なし。モードは「${T.mode}」。`;map.next="昼会と夕会で損益と損失の段階を確認します。"}
  if(id==="trader"){const o=D.orders;map.why="判断に使った終値ではなく、次の寄付き値で約定させます。先読みを防ぐためです。";map.num=`発注${o.length}件（寄付き成行・100株単位）。`;map.next="寄付きの約定を確認し、16:30に記録します。"}
  if(id==="scribe"){map.why="誰が何を根拠に決めたかを、後から確かめられるようにするためです。";map.num=`今日の投稿${mine.length}件。`;map.next="昼会と夕会の議事録、引け後報告を書きます。"}
  return{map,mine}}
function openStaff(id){const s=BY[id],{map,mine}=info(id);
  openDrawer(`<span style="color:${s.c}">${esc(s.role)}</span> <span style="font-size:13px;color:var(--mute);font-weight:500">${esc(s.name)}</span>`,
    `<div class="stf"><div class="pvid"><video src="media/${id}.mp4" poster="media/${id}.jpg" ${RM?"":"autoplay"} muted loop playsinline></video></div>
     <div class="box" style="margin:0"><h5>${esc(s.role)}に聞く</h5><div class="ask">${[["now","いま何してる？"],["why","判断の理由は？"],["num","数字を教えて"],["next","次は？"]].map(([k,l])=>`<button type="button" data-q="${k}">${l}</button>`).join("")}</div>

function mergeOwner(list){const fresh=list.filter(m=>!ownerSeen.has(m.id)).sort((a,b)=>a.ts.localeCompare(b.ts));
  fresh.forEach(m=>{ownerSeen.add(m.id);D.chat.push(m);const i=D.chat.length-1;

async function saveOwnerMsg(m){const ref=db.doc("ownerchat/"+m.date);const snap=await ref.get();const msgs=(snap.exists?snap.data().msgs:[])||[];

async function initOwnerChat(){if(!(window.claude&&typeof window.claude.use==="function"))return;

    if(!sampleFn)return;const s=BY[to],ty=document.getElementById("typing");ty.innerHTML=`${esc(s.role)}（${esc(s.name)}）が入力中<span class="dots"><i></i><i></i><i></i></span>`;
    const recent=D.chat.filter(x=>x.date===latestDate||x.date===today()).slice(-40).map(x=>`${BY[x.from]?.role||x.from}（${BY[x.from]?.name||""}）#${x.channel}: ${x.text}`);

      await saveOwnerMsg(rep).catch(()=>{});mergeOwner([rep])}
    catch(err){ty.innerHTML="";alertBar(err?.code==="rate_limited"?"少し待ってからもう一度送ってください":"返事を作れませんでした（メッセージは保存済みで、次の会議で取り上げます）")}}}
